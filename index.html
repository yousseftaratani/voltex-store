<script>
/*
  IMPORTANT:
  هذه النسخة تحتوي على واجهة الإدارة، لكن التخزين المحلي مناسب للتجربة فقط وليس تخزينًا آمنًا على خادم.
  قبل نشر الموقع للبيع، اربط النموذج بخدمة تخزين خارجية ذات لوحة محمية.
  خدمات مثل SimpleForm توفر تخزين submissions ولوحة بحث وتصدير للـ HTML.
*/
const STORAGE_KEY='voltex_orders_v1';
function pick(p){document.getElementById('product').value=p;document.getElementById('orderBox').scrollIntoView({behavior:'smooth'})}
function getOrders(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}}
function render(){
 const o=getOrders(); document.getElementById('count').textContent=o.length;
 document.getElementById('pieces').textContent=o.reduce((a,x)=>a+Number(x.qty||0),0);
 document.getElementById('revenue').textContent=o.reduce((a,x)=>a+Number(x.qty||0)*50,0)+' DT';
 document.getElementById('rows').innerHTML=o.slice().reverse().map(x=>`<tr><td>${x.time}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.state}</td><td>${x.product}</td><td>${x.size}</td><td>${x.qty}</td><td>${x.address}</td></tr>`).join('');
}
function adminLogin(){
 const pass=prompt('أدخل كود الإدارة');
 if(pass==='VOLTEX2026'){document.getElementById('admin').style.display='block';render();document.getElementById('admin').scrollIntoView({behavior:'smooth'})}
 else if(pass!==null) alert('الكود غير صحيح');
}
document.getElementById('orderForm').addEventListener('submit',e=>{
 e.preventDefault();
 const order={time:new Date().toLocaleString('ar-TN'),name:name.value,phone:phone.value,state:state.value,size:size.value,qty:qty.value,product:product.value,address:address.value};
 const orders=getOrders();orders.push(order);localStorage.setItem(STORAGE_KEY,JSON.stringify(orders));
 e.target.parentElement.style.display='none';document.getElementById('success').style.display='block';window.scrollTo({top:0,behavior:'smooth'});
});
</script>
